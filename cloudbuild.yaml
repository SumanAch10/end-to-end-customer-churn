# Cloud Build config for the combined API + UI image.
#
# `gcloud builds submit --tag` always builds a Dockerfile named exactly
# "Dockerfile" at the source root, and it has no flag to point at another
# file. This project's Cloud Run image lives in Dockerfile.cloudrun, so the
# build goes through an explicit config instead.
#
#   gcloud builds submit --config cloudbuild.yaml .

substitutions:
  _REGION: us-central1
  _REPO: telco-churn
  _SERVICE: telco-churn-app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cloudrun
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID

# Installing the dependency stack takes well over the 10-minute default.
timeout: 1800s

options:
  # Without this, builds fail on projects that have no default logs bucket.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
